plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batchbite.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.batchbite.app"
        minSdk 26
        targetSdk 37
        versionCode 5
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += file('../../www')
        }
    }
}

// Name the built APK "BatchBite-<version>.apk" instead of the default "app-debug.apk"
tasks.matching { it.name == 'packageDebug' || it.name == 'packageRelease' }.configureEach { t ->
    doLast {
        def outDir = layout.buildDirectory.dir("outputs/apk/${t.name.replace('package','').toLowerCase()}")
        def dir = outDir.get().asFile
        if (dir.exists()) {
            dir.eachFileMatch(~/.+\.apk$/) { f ->
                def target = new File(f.parentFile, "BatchBite-${android.defaultConfig.versionName}.apk")
                if (!f.name.startsWith('BatchBite-')) {
                    f.renameTo(target)
                }
            }
        }
    }
}
