plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batchbite.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.batchbite.app"
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += file('../../www')
        }
    }
}
