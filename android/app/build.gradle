plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batchbite.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.batchbite.app"
        minSdk 26
        targetSdk 37
        versionCode 5
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += file('../../www')
        }
    }
}

// Publish a pretty-named copy of the APK. This is a COPY, never a move: AGP's
// incremental packager tracks "app-debug.apk" as packageDebug's output, and if
// that file goes missing between builds (which the old doLast-rename did), the
// next asset-only incremental build re-zips ONLY the changed entry -> a corrupt
// APK (e.g. just assets/index.html) that fails to install. Fixed 2026-10-17.
tasks.register("renameDebugApk", Copy) {
    dependsOn ":app:packageDebug"
    from(layout.buildDirectory.dir("outputs/apk/debug/app-debug.apk"))
    into(layout.projectDirectory.dir("dist"))
    rename("app-debug.apk", "BatchBite-${android.defaultConfig.versionName}.apk")
}

// Produce the pretty-named copy with a plain `assembleDebug` build.
afterEvaluate {
    tasks.named("assembleDebug").configure { it.finalizedBy(tasks.named("renameDebugApk")) }
}
